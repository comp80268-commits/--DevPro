{% extends 'base.html' %}

{% block title %}Удаление статьи{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">⚠️ Подтверждение удаления</h4>
                </div>
                <div class="card-body">
                    <p class="fs-5">Вы уверены, что хотите удалить статью:</p>
                    <h3 class="text-danger">"{{ article.title }}"</h3>
                    <hr>
                    <p class="text-muted">Это действие <strong>нельзя будет отменить</strong>.</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-trash"></i> Да, удалить
                            </button>
                            <a href="{% url 'article_detail' article.slug %}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Отмена
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
