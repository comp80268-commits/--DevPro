{% extends 'base.html' %}
{% load static %}

{% block title %}Контакты{% endblock %}

{% block content %}
<div class="container py-5">
    <h1 class="text-center mb-5">Свяжитесь с нами</h1>

    <div class="row">
        <div class="col-md-6">
            <h4>Наши контакты</h4>
            <ul class="list-unstyled fs-5">
                <li><i class="bi bi-geo-alt text-primary"></i> г. Бишкек, ул. Московская, 123</li>
                <li><i class="bi bi-phone text-primary"></i> +996 (555) 12-34-56</li>
                <li><i class="bi bi-envelope text-primary"></i> info@devpro.kg</li>
                <li><i class="bi bi-clock text-primary"></i> Пн-Пт: 9:00 - 18:00</li>
            </ul>
        </div>
        <div class="col-md-6">
            <h4>Напишите нам</h4>
            <form>
                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="Ваше имя">
                </div>
                <div class="mb-3">
                    <input type="email" class="form-control" placeholder="Ваш Email">
                </div>
                <div class="mb-3">
                    <textarea class="form-control" rows="4" placeholder="Сообщение"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Отправить</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
